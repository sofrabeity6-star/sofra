# يوقظ الخادم على Render المجاني كل 10 دقائق ويشغّل التجهيز التلقائي للطلبات المجدولة.
# أضف في GitHub ← Settings ← Secrets and variables ← Actions:
#   SOFRA_URL   = رابط الخادم على Render (مثال https://sofra.onrender.com)
#   CRON_SECRET = نفس قيمة CRON_SECRET في Render
name: cron
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: tick
        env:
          SOFRA_URL: ${{ secrets.SOFRA_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SOFRA_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SOFRA_URL / CRON_SECRET غير مضبوطين بعد"; exit 0; fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 "$SOFRA_URL/api/cron/tick?key=$CRON_SECRET"
